# MongoDB Server - STAGING Environment
# Deployed on cloud server with TLS encryption
# See MONGO.md for setup instructions

services:
  mongodb:
    image: mongo:8.0.13
    container_name: latext-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 6364c3b75dfa0a523296bea188de76e696e04d72a023f9d175aad8d407eb9cee
      MONGO_INITDB_DATABASE: latext_db
    volumes:
      - mongodb_data:/data/db
      # Mount TLS certificates from Let's Encrypt
      - /etc/letsencrypt/live/staging.latext.ai:/certs:ro
    # TLS enabled with Let's Encrypt certificates
    command: mongod --tlsMode requireTLS --tlsCertificateKeyFile /certs/mongodb.pem --bind_ip_all
    networks:
      - latext-network

volumes:
  mongodb_data:

networks:
  latext-network:
    driver: bridge
