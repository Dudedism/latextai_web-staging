# MongoDB Server - PRODUCTION Environment
# Deployed on cloud server with TLS encryption
# See MONGO.md for setup instructions

services:
  mongodb:
    image: mongo:8.0.13
    container_name: latext-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: b13aa0e5f6147ca8cb3055c59a15e336591dfb4ad932944b3f397498ee3b9085
      MONGO_INITDB_DATABASE: latext_db
    volumes:
      - mongodb_data:/data/db
      # Mount TLS certificates from Let's Encrypt
      - /etc/letsencrypt/live/latext.ai:/certs:ro
    # TLS enabled with Let's Encrypt certificates
    command: mongod --tlsMode requireTLS --tlsCertificateKeyFile /certs/mongodb.pem --tlsCAFile /certs/fullchain.pem --bind_ip_all
    networks:
      - latext-network

volumes:
  mongodb_data:

networks:
  latext-network:
    driver: bridge