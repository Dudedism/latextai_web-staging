version: '3.8'

services:
  mongodb:
    image: mongo:8.0.13
    container_name: latext-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: latext_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - latext-network

volumes:
  mongodb_data:

networks:
  latext-network:
    driver: bridge